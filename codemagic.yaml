workflows:
  android-apk-debug:
    name: Italy AI Cultural Tourism - APK (Debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make Gradle launcher executable
        script: chmod +x ./gradlew
      - name: Build debug APK
        script: ./gradlew :app:assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-apk-release:
    name: Italy AI Cultural Tourism - APK (Release)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make Gradle launcher executable
        script: chmod +x ./gradlew
      - name: Build release APK
        script: ./gradlew :app:assembleRelease --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/release/*.apk
